version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: studyhub
      POSTGRES_USER: studyhub_user
      POSTGRES_PASSWORD: studyhub_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://studyhub_user:studyhub_password@db:5432/studyhub
      - REDIS_URL=redis://redis:6379/1
      - DEBUG=1
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
